<style>
/* Layout: phone-shaped app shell. Top bar + scrolling page + bottom tab bar with a sliding pill. Sheets slide up over a dim backdrop. Six category colours carry the whole library. */
:root{
  --bg:#F3F3F8; --surface:#FFFFFF; --surface2:#EAEAF3; --line:#DBDBE7; --fg:#171826; --muted:#666981;
  --accent:#FF6A3D; --accent-ink:#FFFFFF;
  --c-progress:#1F7FE6; --c-completed:#17A06A; --c-backlog:#C98A00; --c-paused:#7C5CE0; --c-abandoned:#D23B3B; --c-wishlist:#D6408D;
  --gold:#E2A400; --shadow:0 8px 24px rgba(20,20,50,.08);
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E0F17; --surface:#171926; --surface2:#222536; --line:#2B2F44; --fg:#EDEEF6; --muted:#9093AB;
    --c-progress:#4BA3FF; --c-completed:#3CCB8F; --c-backlog:#F2B93B; --c-paused:#A98EFF; --c-abandoned:#F26A66; --c-wishlist:#F57AB9;
    --gold:#F2B93B; --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E0F17; --surface:#171926; --surface2:#222536; --line:#2B2F44; --fg:#EDEEF6; --muted:#9093AB;
  --c-progress:#4BA3FF; --c-completed:#3CCB8F; --c-backlog:#F2B93B; --c-paused:#A98EFF; --c-abandoned:#F26A66; --c-wishlist:#F57AB9;
  --gold:#F2B93B; --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.45 var(--body);-webkit-tap-highlight-color:transparent;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gx{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .sm{font-size:12.5px}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;position:relative;background:var(--bg);overflow:hidden}
@media(min-width:560px){#app{border-inline:1px solid var(--line)}}
.view{flex:1;min-height:0;display:flex;flex-direction:column}
.view.out{animation:vout .12s ease forwards}
.view.inr{animation:inr .34s cubic-bezier(.2,.8,.2,1)}
.view.inl{animation:inl .34s cubic-bezier(.2,.8,.2,1)}
.view.inr .cat,.view.inl .cat{animation:rise .45s cubic-bezier(.2,.9,.3,1) both;animation-delay:calc(var(--i)*45ms)}
@keyframes vout{to{opacity:0;transform:translateY(4px)}}
@keyframes inr{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
@keyframes inl{from{opacity:0;transform:translateX(-34px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
.top h1{font:800 26px/1.1 var(--display);letter-spacing:-.02em}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.who h1{font-size:22px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.page{display:flex;flex-direction:column;gap:16px;padding-block:6px 28px}
.iconbtn{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:14px;background:var(--surface);border:1px solid var(--line);position:relative}
.iconbtn.sm{width:38px;height:38px;border-radius:12px}
.dot{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.av{--s:40px;width:var(--s);height:var(--s);border-radius:50%;display:grid;place-items:center;color:#fff;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.av svg{width:55%;height:55%}
.seg{display:flex;gap:2px;background:var(--surface2);border-radius:14px;padding:3px}
.seg button{flex:1;min-width:0;padding:8px 6px;border-radius:11px;font-size:13px;font-weight:600;color:var(--muted);transition:background .2s,color .2s}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.basis{display:flex;align-items:center;justify-content:space-between;gap:10px}
.basis .seg{flex:1}
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cat{--c:var(--accent);text-align:left;border:1.5px solid color-mix(in srgb,var(--c) 38%,var(--line));background:linear-gradient(150deg,color-mix(in srgb,var(--c) 20%,var(--surface)),color-mix(in srgb,var(--c) 5%,var(--surface)));border-radius:18px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;grid-template-areas:"ic n" "l h";gap:10px 8px;align-items:end;transition:transform .15s,box-shadow .2s}
.cat:active{transform:scale(.97)}
.cat.on{box-shadow:0 0 0 2.5px var(--c)}
.cat-ic{grid-area:ic;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 24%,transparent);color:var(--c);align-self:start}
.cat-n{grid-area:n;font:800 32px/1 var(--display);color:var(--c);text-align:right;font-variant-numeric:tabular-nums}
.cat-l{grid-area:l;font-size:13px;font-weight:600;line-height:1.2;min-width:0}
.cat-h{grid-area:h;font-family:var(--mono);font-size:12px;color:var(--muted)}
.tools{display:flex;gap:8px;align-items:center}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 12px;height:44px;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:none;outline:0;color:var(--fg);-webkit-appearance:none;appearance:none}
.list-head{display:flex;align-items:baseline;justify-content:space-between}
.list-head h2,.gh{font:700 18px/1.2 var(--display);letter-spacing:-.01em}
.count{font:600 13px var(--mono);color:var(--muted);margin-left:4px}
.total{font-size:12.5px;color:var(--muted)}
.link{color:var(--accent);font-weight:600;font-size:13px}
.ggrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px}
@media(min-width:440px){.ggrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.gcard{text-align:left;display:flex;flex-direction:column;gap:7px;min-width:0}
.cv{position:relative;aspect-ratio:3/4;border-radius:14px;overflow:hidden;max-width:100%}
.cover{position:absolute;inset:0;display:grid;place-items:center;font:800 clamp(24px,9vw,36px)/1 var(--display);letter-spacing:-.03em;color:rgba(255,255,255,.92);background:repeating-linear-gradient(135deg,rgba(255,255,255,.07) 0 2px,transparent 2px 12px),linear-gradient(160deg,hsl(var(--h) 62% 42%),hsl(calc(var(--h) + 45) 66% 22%))}
.rcv{position:relative;width:52px;aspect-ratio:3/4;border-radius:10px;overflow:hidden;flex:none}
.rcv .cover{font-size:15px}
.rcv.big{width:68px}.rcv.big .cover{font-size:21px}
.cimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.shotw{flex:none;width:210px;aspect-ratio:16/9;border-radius:12px;overflow:hidden;scroll-snap-align:start;background:var(--surface2);max-width:80%}.shotw img{width:100%;height:100%;object-fit:cover;display:block}
.shotw.big{width:88%;max-width:none}
.stiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stile{--c:var(--accent);display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);font-size:12.5px;font-weight:600;text-align:center;transition:background .15s,border-color .15s}
.stile svg{color:var(--c)}
.stile.on{background:color-mix(in srgb,var(--c) 22%,var(--surface));border-color:var(--c);color:var(--fg)}
.dt{font:800 22px/1.15 var(--display);letter-spacing:-.02em;overflow-wrap:anywhere}
.covbtn{padding:0;display:block}
.xmain{flex:1;min-width:0;display:flex;gap:12px;align-items:center;text-align:left;cursor:pointer}
.ex{font-size:16px}.ex .search{height:50px}.ex .search input{font-size:17px}.ex .gh{font-size:21px}
.ex .xrow .gt{font-size:17px}.ex .xrow .muted{font-size:14.5px}.ex .xrow .sm{font-size:13.5px}.ex .xrow .rcv{width:62px}.ex .btn.sm{height:40px;font-size:14px}
.sb{position:absolute;left:8px;top:8px;display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 8px 3px 6px;border-radius:999px;background:rgba(10,10,20,.74);color:#fff;backdrop-filter:blur(4px);max-width:calc(100% - 44px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--c)}
.med{position:absolute;right:7px;top:7px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#FFE08A,#E2A400);color:#5a3d00}
.gt{font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.gm{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.medi{display:inline-grid;vertical-align:-2px;margin-left:6px;color:var(--gold)}
.glist{display:flex;flex-direction:column;gap:8px}
.grow{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;text-align:left;width:100%}
.gi{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.gr{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.pbar,.track{height:5px;border-radius:3px;background:var(--surface2);overflow:hidden}
.pbar i,.track i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.pill{--c:var(--accent);display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--c) 16%,transparent);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.empty{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:34px 20px;color:var(--muted);border:1.5px dashed var(--line);border-radius:20px}
.empty b{color:var(--fg);font:700 17px var(--display)}
.empty svg{opacity:.6;margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{--c:var(--accent);padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;transition:background .15s,border-color .15s}
.chip.on{background:color-mix(in srgb,var(--c) 20%,var(--surface));border-color:var(--c);font-weight:600}
.chip .x{margin-left:6px;opacity:.6}
.chips.scrollx{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips.scrollx .chip{flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:14px;background:var(--surface2);font-weight:600;border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.wide{width:100%}
.btn.sm{height:36px;padding:0 12px;font-size:13px;border-radius:12px}
.btn.danger{color:var(--c-abandoned);border-color:color-mix(in srgb,var(--c-abandoned) 40%,var(--line));background:var(--surface)}
.btn:active{transform:scale(.98)}
.lab{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.fld{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);padding:0 12px;outline:0}
.fld:focus{border-color:var(--accent)}
textarea.fld{height:auto;min-height:92px;padding:10px 12px;resize:vertical}
select.fld{-webkit-appearance:none;appearance:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:14px}
.card h2{font:700 17px var(--display)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.nav{flex:none;background:var(--surface);border-top:1px solid var(--line);padding-top:8px;padding-bottom:max(8px,env(safe-area-inset-bottom,0px))}
.nav-row{position:relative;display:grid;grid-template-columns:repeat(4,1fr)}
.ind{position:absolute;top:0;left:0;width:25%;height:32px;display:grid;place-items:center;pointer-events:none;transition:transform .4s cubic-bezier(.3,1.3,.5,1)}
.ind i{display:block;width:60px;height:32px;border-radius:16px;background:color-mix(in srgb,var(--accent) 24%,transparent)}
.nb{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:11.5px;font-weight:600;padding-bottom:2px}
.nb span.i{height:32px;display:grid;place-items:center}
.nb.on{color:var(--fg)} .nb.on span.i{color:var(--accent)}
#sheet{position:fixed;inset:0;z-index:50;display:none;justify-content:center;align-items:flex-end;background:rgba(6,7,14,.58);animation:fade .2s}
#sheet.on{display:flex}
.sheet{width:100%;max-width:520px;max-height:calc(100% - env(safe-area-inset-top,0px) - 24px);overflow-y:auto;background:var(--surface);border-radius:26px 26px 0 0;border:1px solid var(--line);border-bottom:0;padding-top:10px;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));animation:up .34s cubic-bezier(.2,.9,.3,1);overscroll-behavior:contain}
.grab{width:42px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sh{display:flex;flex-direction:column;gap:16px}
.sh-head{display:flex;align-items:flex-start;gap:12px}
.sh-head>.grow1{flex:1;min-width:0}
.sh-title{display:flex;align-items:center;justify-content:space-between}
.sh-title h2{font:800 22px var(--display);letter-spacing:-.02em}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.tag{font-size:11px;padding:2px 8px;border-radius:6px;background:var(--surface2);color:var(--muted)}
.xrow{display:flex;gap:12px;align-items:center;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.xi{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.xlist{display:flex;flex-direction:column;gap:8px}
.car{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.rec{flex:none;width:148px;scroll-snap-align:start;display:flex;flex-direction:column;gap:7px;min-width:0}
.rec .why{font-size:11.5px;color:var(--muted);line-height:1.3}
.ai{border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line));background:linear-gradient(140deg,color-mix(in srgb,var(--accent) 12%,var(--surface)),var(--surface));border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:12px}
.dots{display:inline-flex;gap:4px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:bl 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
.rlist{display:flex;flex-direction:column;gap:12px}
.rcard{text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:12px}
.rtop{display:flex;align-items:center;gap:12px}
.rinfo{flex:1;min-width:0}
.ring{--p:70;width:54px;height:54px;border-radius:50%;flex:none;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface2) 0);display:grid;place-items:center}
.ring span{width:42px;height:42px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font:800 15px var(--display)}
.ring.big{width:84px;height:84px}.ring.big span{width:68px;height:68px;font-size:24px}
.bars{display:flex;flex-direction:column;gap:7px}
.b4{display:grid;grid-template-columns:104px 1fr 30px;gap:10px;align-items:center;font-size:12.5px;color:var(--muted)}
.b4 b{color:var(--fg);text-align:right;font-weight:600}
.rtext{font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:4px}
.tile b{font:800 30px/1.05 var(--display);letter-spacing:-.02em}
.tile span{font-size:12.5px;color:var(--muted)}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface2);gap:2px}
.stack i{display:block;min-width:4px}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;font-size:13px}
.legend div{display:flex;align-items:center;gap:8px;min-width:0}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend b{margin-left:auto;font-family:var(--mono);font-weight:600}
.bl{display:flex;flex-direction:column;gap:9px}
.bl .it{display:grid;grid-template-columns:96px 1fr 26px;gap:10px;align-items:center;font-size:13px}
.bl .it span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bl .it b{font-family:var(--mono);font-size:12.5px;text-align:right}
.shots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.shot{aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--surface2)}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
#lightbox{position:fixed;inset:0;z-index:70;background:rgba(4,5,10,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px));animation:fade .2s;color:#fff}
#lightbox[hidden]{display:none}
#lightbox img{max-width:100%;max-height:72%;border-radius:14px;object-fit:contain}
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.mcard.locked svg{filter:grayscale(1);opacity:.45}
.mhero{display:flex;align-items:center;gap:16px;background:linear-gradient(140deg,color-mix(in srgb,var(--gold) 20%,var(--surface)),var(--surface));border:1px solid color-mix(in srgb,var(--gold) 45%,var(--line));border-radius:22px;padding:16px}
.mhero h2{font:800 22px var(--display)}
.sl{display:flex;flex-direction:column;gap:2px}
.slh{display:flex;justify-content:space-between;align-items:center;font-weight:600}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--accent) var(--fill,50%),var(--surface2) var(--fill,50%))}

var PAGE=30;
function newList(){return {q:'',items:[],state:'idle',err:'',offset:0,more:false,busy:false}}
function cleanQ(q){return q.replace(/["\\]/g,' ').slice(0,80)}
function liveFetch(off){return igdbQuery('search "'+cleanQ(ui.live.q)+'"; where version_parent = null; limit '+PAGE+'; offset '+off+';')}
function topFetch(off){return igdbQuery('where total_rating_count > 100 & version_parent = null; sort total_rating_count desc; limit '+PAGE+'; offset '+off+';')}
function loadList(key,fetchFn,more){var st=ui[key];
if(more){if(st.busy)return;st.busy=true}else{st=ui[key]={q:ui.exQ.trim(),items:[],state:'loading',err:'',offset:0,more:false,busy:false}}
var off=more?st.offset:0;updateExplore();
fetchFn(off).then(function(items){if(ui[key]!==st)return;var seen={};st.items.forEach(function(c){seen[c.igdbId]=1});items.forEach(function(c){if(!seen[c.igdbId]){st.items.push(c);seen[c.igdbId]=1}});st.offset+=items.length;st.more=items.length>=PAGE;st.state='ok';st.err='';st.busy=false;updateExplore()})
.catch(function(e){if(ui[key]!==st)return;igdbFail(e);st.err=ui.igdbErr;if(!more)st.state='err';st.busy=false;updateExplore()})}

return '<div class="top gx"><h1>'+t('explore')+'</h1></div><div class="scroll"><div class="gx page ex">'+

if((st.state==='loading'||st.state==='idle')&&!st.items.length)return h+'<div class="row"><span class="muted">IGDB</span><span class="dots"><i></i><i></i><i></i></span></div>';
if(st.state==='err'&&!st.items.length)return h+'<p style="color:var(--c-abandoned)">'+esc(st.err||'IGDB error')+'</p>';

return h+'<div class="xlist">'+st.items.map(function(c){return xRow(c)}).join('')+'</div>'+(st.err?'<p class="sm" style="margin-top:10px;color:var(--c-abandoned)">'+esc(st.err)+'</p>':'')+(st.more?'<button class="btn wide" style="margin-top:12px" data-a="'+moreAct+'">'+(st.busy?'…':t('loadMore'))+'</button>':'')}

function askGemini(){if(!S.settings.geminiKey){ui.ai={state:'nokey',items:[]};renderAI();return}
ui.ai={state:'loading',items:[]};renderAI();
var lib=S.games.filter(function(g){return g.status!=='wishlist'}).map(function(g){return g.title+' ('+t('st_'+g.status)+(g.review?', score '+avg(g.review):'')+')'}).join('; ')||'none yet';
var owned=S.games.map(function(g){return g.title}).join('; ')||'none';
var prompt='You recommend video games. The player library: '+lib+'. Never suggest any of these titles: '+owned+'. Return 6 games they would enjoy as a JSON array of objects with keys title, year (number), genres (array of strings), reason (one sentence, max 20 words, written in '+(S.settings.lang==='id'?'Indonesian':'English')+').';
fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(S.settings.geminiModel||'gemini-3.8-flash')+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':S.settings.geminiKey},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{responseMimeType:'application/json'}})})
.then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})
.then(function(j){var arr=JSON.parse(j.candidates[0].content.parts[0].text);var items=arr.slice(0,6).map(function(x,i){return {cid:'a'+i,title:String(x.title),year:x.year||'',dev:'',genres:Array.isArray(x.genres)?x.genres:[],platforms:[],hltb:{main:0,extra:0,comp:0},reason:x.reason||''}});
return Promise.all(items.map(function(it){return igdbOn()?igdbSearch(it.title).then(function(r){var m=bestMatch(r,it.title);if(m){it.cover=m.cover;it.summary=m.summary;it.shots=m.shots;it.igdbId=m.igdbId;if(!it.dev)it.dev=m.dev;if(m.platforms.length)it.platforms=m.platforms;if(m.hltb&&m.hltb.main&&!(it.hltb&&it.hltb.main))it.hltb=m.hltb}return it}):Promise.resolve(it)})).then(function(done){ui.ai={state:'ok',items:done};renderAI()})})
.catch(function(){ui.ai={state:'err',items:[]};renderAI()})}
var GMAP={'Role-playing (RPG)':'RPG','Platform':'Platformer','Simulator':'Simulation','Sport':'Sports','Real Time Strategy (RTS)':'Strategy','Turn-based strategy (TBS)':'Strategy',"Hack and slash/Beat 'em up":'Action','Point-and-click':'Adventure'};
function mapPlat(a){a=String(a||'');if(/ps5/i.test(a))return 'PS5';if(/ps4/i.test(a))return 'PS4';if(/xone|series|xbox/i.test(a))return 'Xbox';if(/switch/i.test(a))return 'Switch';if(/android|ios/i.test(a))return 'Mobile';if(/pc|win/i.test(a))return 'PC';return 'Other'}
function igdbOn(){var c=S.settings;return !!(c.igdbClientId&&c.igdbClientSecret)}
// Every request goes through the Proxy URL setting: proxy + encodeURIComponent(target). Empty proxy = direct call.
function viaProxy(u){var p=(S.settings.proxyUrl||'').trim();return p?p+encodeURIComponent(u):u}
var IFIELDS='name,first_release_date,summary,cover.image_id,screenshots.image_id,genres.name,platforms.abbreviation,involved_companies.company.name,involved_companies.developer';
var IMGB='https://images.igdb.com/igdb/image/upload/';
var directTok=null,directExp=0;
function directToken(){var c=S.settings;if(directTok&&Date.now()<directExp)return Promise.resolve(directTok);
var tu='https://id.twitch.tv/oauth2/token?client_id='+encodeURIComponent(c.igdbClientId)+'&client_secret='+encodeURIComponent(c.igdbClientSecret)+'&grant_type=client_credentials';
return fetch(viaProxy(tu),{method:'POST'}).then(function(r){if(!r.ok)throw new Error('Twitch login failed ('+r.status+'). Check the Client ID and Secret.');return r.json()}).then(function(j){if(!j||!j.access_token)throw new Error('Twitch login failed. Check the Client ID and Secret.');directTok=j.access_token;directExp=Date.now()+Math.max(60,(j.expires_in||3600)-300)*1000;return directTok})}
function igdbPost(ep,body){var c=S.settings;return directToken().then(function(tok){return fetch(viaProxy('https://api.igdb.com/v4/'+ep),{method:'POST',headers:{'Client-ID':c.igdbClientId,'Authorization':'Bearer '+tok,'Accept':'application/json'},body:body})}).then(function(r){if(r.status===401)directTok=null;if(!r.ok)throw new Error('IGDB error '+r.status);return r.json()})}
function toItem(g){var co=g.involved_companies||[],dv=co.find(function(c){return c.developer})||co[0];
return {cid:'i'+g.id,igdbId:g.id,title:g.name,year:g.first_release_date?new Date(g.first_release_date*1000).getUTCFullYear():'',dev:dv&&dv.company?dv.company.name:'',
genres:(g.genres||[]).map(function(x){return GMAP[x.name]||x.name}),
platforms:(g.platforms||[]).map(function(x){return x.abbreviation}).filter(Boolean).map(mapPlat).filter(function(v,i,a){return a.indexOf(v)===i}),
cover:g.cover&&g.cover.image_id?IMGB+'t_cover_big/'+g.cover.image_id+'.jpg':'',summary:g.summary||'',
shots:(g.screenshots||[]).slice(0,8).map(function(x){return IMGB+'t_screenshot_big/'+x.image_id+'.jpg'}),hltb:{main:0,extra:0,comp:0}}}
async function igdbTest(){var c=S.settings,out=[],show=function(){var el=$('#testOut');if(el)el.textContent=out.join('\n')},last=function(x){out[out.length-1]=x;show()};
if(!c.igdbClientId||!c.igdbClientSecret){out.push('Enter the Client ID and Client Secret first.');show();return}
out.push('Proxy: '+((c.proxyUrl||'').trim()||'none (direct)'));out.push('1. Twitch login...');show();var tok;
try{var tu='https://id.twitch.tv/oauth2/token?client_id='+encodeURIComponent(c.igdbClientId)+'&client_secret='+encodeURIComponent(c.igdbClientSecret)+'&grant_type=client_credentials';
var r=await fetch(viaProxy(tu),{method:'POST'}),tx=await r.text();
if(!r.ok){last('✗ 1. Twitch login: HTTP '+r.status+' '+tx.slice(0,200));return}
var j;try{j=JSON.parse(tx)}catch(e){last('✗ 1. The proxy did not return JSON (it may be showing its own page): '+tx.slice(0,200));return}
if(!j.access_token){last('✗ 1. No token in the reply: '+tx.slice(0,200));return}tok=j.access_token;last('✓ 1. Twitch login OK')}
catch(e){last('✗ 1. The request never completed ('+(e&&e.message||e)+'). The browser blocked it, the proxy refused this site, or you are offline.');return}
out.push('2. IGDB query...');show();
try{var r2=await fetch(viaProxy('https://api.igdb.com/v4/games'),{method:'POST',headers:{'Client-ID':c.igdbClientId,'Authorization':'Bearer '+tok,'Accept':'application/json'},body:'fields name; limit 1;'}),t2=await r2.text();
if(!r2.ok){last('✗ 2. IGDB: HTTP '+r2.status+' '+t2.slice(0,200));return}
last('✓ 2. IGDB OK '+t2.replace(/\s+/g,' ').slice(0,80))}
catch(e){last('✗ 2. The request never completed ('+(e&&e.message||e)+'). The proxy may drop the Authorization or Client-ID headers, or refuses this site.')}}
function igdbQuery(where){return igdbPost('games','fields '+IFIELDS+'; '+where).then(function(a){ui.igdbErr='';return a.map(toItem)})}
function igdbFail(e){ui.igdbErr=(e&&e.name==='TypeError')?t('igdbBlocked'):((e&&e.message)||'IGDB error');return []}
function igdbSearch(q){if(!igdbOn())return Promise.resolve([]);return igdbQuery('search "'+q.replace(/["\\]/g,' ').slice(0,80)+'"; where version_parent = null; limit 10;').catch(igdbFail)}
function igdbTop(){if(!igdbOn())return Promise.resolve([]);return igdbQuery('where total_rating_count > 100 & version_parent = null; sort total_rating_count desc; limit 20;')}
function bestMatch(items,title){var n=norm(title);return items.find(function(i){return norm(i.title)===n})||items[0]||null}
function applyInfo(g,x){if(x.cover)g.cover=x.cover;if(x.summary)g.summary=x.summary;if(x.shots&&x.shots.length)g.shots=x.shots;if(!g.year&&x.year)g.year=x.year;if(!g.dev&&x.dev)g.dev=x.dev;if(!g.genres.length&&x.genres&&x.genres.length)g.genres=x.genres.slice();if(x.hltb&&x.hltb.main&&!(g.hltb&&g.hltb.main))g.hltb=Object.assign({},x.hltb);if(x.igdbId)g.igdbId=x.igdbId}
function syncGame(g){var p=igdbOn()?igdbSearch(g.title).then(function(items){var m=bestMatch(items,g.title);if(m){applyInfo(g,m);return true}return false}):Promise.resolve(false);
return p.then(function(ok){return hltbRemote(g.title).then(function(h){if(h){g.hltb=h;return true}return ok})})}
function syncAll(){var gs=S.games.filter(function(g){return !g.cover||!g.summary||!(g.shots&&g.shots.length)}),n=0,i=0;toast(t('syncing',{m:gs.length}));
(function next(){if(i>=gs.length){saveNow();toast(t('synced',{n:n}));refresh();return}var g=gs[i++];syncGame(g).then(function(ok){if(ok)n++}).then(function(){setTimeout(next,300)})})()}
var HLTB='https://hltb-proxy.fly.dev/v1/query?title=';
function pickNum(o,keys){for(var i=0;i<keys.length;i++){var v=o&&o[keys[i]];v=typeof v==='string'?parseFloat(v):v;if(typeof v==='number'&&isFinite(v)&&v>0)return v>=1000?v/3600:v}return 0}
function hltbParse(j,title){var arr=Array.isArray(j)?j:(j&&(j.data||j.results||j.games))||(j&&typeof j==='object'?[j]:[]);if(!Array.isArray(arr))arr=[arr];var n=norm(title);
var it=arr.find(function(x){return x&&norm(x.game_name||x.name||x.title||x.gameName)===n})||arr[0];if(!it)return null;
var r2=function(v){return v?Math.round(v*2)/2:0};
var main=pickNum(it,['gameplayMain','comp_main','mainStory','main_story','main','mainTime']),extra=pickNum(it,['gameplayMainExtra','comp_plus','mainExtra','main_extra','mainPlusExtras','extra']),comp=pickNum(it,['gameplayCompletionist','comp_100','completionist','completion','all']);
if(!main&&!extra&&!comp)return null;main=main||extra||comp;return {main:r2(main),extra:r2(extra||main),comp:r2(comp||extra||main)}}
function hltbSync(g,onlyEmpty){if(onlyEmpty&&g.hltb&&g.hltb.main)return;hltbRemote(g.title).then(function(h){if(h){g.hltb=h;save();refresh()}})}
function hltbRemote(title){return fetch(HLTB+encodeURIComponent(title)).then(function(r){return r.ok?r.json():null}).then(function(j){return j?hltbParse(j,title):null}).catch(function(){return null})}

case 'g-cover-del':var cg=curG();cg.cover='';save();openSheet(gameSheet(cg,!!ui.sh.draft));break;
case 'g-status':var g=curG();g.status=el.dataset.s;if(g.status!=='completed')g.full100=false;$$('#gStatus .chip').forEach(function(b){b.classList.toggle('on',b.dataset.s===g.status)});save();break;
case 'g-genre':var g2=curG(),v2=el.dataset.v,i2=g2.genres.indexOf(v2);if(i2>=0)g2.genres.splice(i2,1);else g2.genres.push(v2);el.classList.toggle('on',i2<0);save();break;
case 'g-add':var gd=ui.sh.draft;if(!gd.title.trim()){toast(t('title')+'?');return}gd.title=gd.title.trim();S.games.push(gd);saveNow();hltbSync(gd,true);blip(880);toast(t('addedTo',{s:t('st_'+gd.status)}));closeSheet();break;
case 'g-del':twoTap(el,function(){var id=ui.sh.id;S.games=S.games.filter(function(x){return x.id!==id});saveNow();closeSheet()});break;
case 'g-lookup':var gl=curG(),isN=!!ui.sh.draft;syncGame(gl).then(function(ok){if(!ok){toast(t('syncFail'));return}save();if(ui.sh&&curG()===gl)openSheet(gameSheet(gl,isN))});break;
case 'g-review':var gr=curG();if(ui.sh.draft)return;reviewSheet(gr.id);break;
case 'g-shot':ui.shotGame=ui.sh.id;$('#fileShot').click();break;
case 'x-add':var item=ui.xmap[el.dataset.k];if(item)addSheet(item);break;
case 'xa-status':ui.xa.status=el.dataset.s;openSheet(addSheetHTML());break;
case 'xa-plat':ui.xa.platform=el.dataset.v;openSheet(addSheetHTML());break;
case 'xa-go':var xa=ui.xa,ng=newGame(xa.item,xa.status,xa.platform);S.games.push(ng);saveNow();hltbSync(ng);blip(880);toast(t('addedTo',{s:t('st_'+xa.status)}));closeSheet();break;
case 'more-live':loadList('live',liveFetch,true);break;
case 'more-top':loadList('top',topFetch,true);break;
case 'x-info':var xi=ui.xmap[el.dataset.k];if(xi)openSheet(infoSheet(xi));break;
case 'xi-add':addSheet(ui.xi);break;
case 'ai-close':ui.ai={state:'idle',items:[]};renderAI();break;
case 'x-ai':askGemini();break;
case 'rv-tab':ui.rvTab=el.dataset.v;refresh();break;
case 'rv-new':pickSheet('review');break;
case 'rv-edit':reviewSheet(el.dataset.id);break;
case 'pick-go':if(ui.pick==='review')reviewSheet(el.dataset.id);else{ui.shotGame=el.dataset.id;closeSheet();$('#fileShot').click()}break;
case 'rv-full':ui.rv.full=!ui.rv.full;el.classList.toggle('on',ui.rv.full);el.setAttribute('aria-checked',ui.rv.full);break;
case 'rv-save':var rg=S.games.find(function(x){return x.id===ui.rv.id});rg.review={visual:ui.rv.visual,gameplay:ui.rv.gameplay,audio:ui.rv.audio,design:ui.rv.design,text:ui.rv.text.trim(),date:Date.now()};rg.full100=ui.rv.full;if(rg.full100)rg.status='completed';saveNow();blip(920);toast(t('saved'));closeSheet();break;
case 'rv-del':twoTap(el,function(){var dg=S.games.find(function(x){return x.id===ui.rv.id});dg.review=null;saveNow();closeSheet()});break;
case 'shot-pick':pickSheet('shot');break;
case 'shot-view':openLightbox(el.dataset.id,+el.dataset.n,el.dataset.k);break;
case 'lb-close':$('#lightbox').hidden=true;break;
case 'lb-del':var lg=S.games.find(function(x){return x.id===el.dataset.id});lg.gallery.splice(+el.dataset.n,1);saveNow();$('#lightbox').hidden=true;refresh();break;
case 'medal-mark':var mg=S.games.find(function(x){return x.id===el.dataset.id});mg.full100=true;mg.status='completed';save();blip(920);refresh();break;
case 'edit-profile':ui.pf=Object.assign({},S.profile,{sample:false});openSheet('<div class="grab"></div><div class="gx sh"><div class="sh-title"><h2>'+t('editProfile')+'</h2><button class="iconbtn sm" data-a="close-sheet" aria-label="'+t('close')+'">'+ic('close',18)+'</button></div><div id="pform" style="display:flex;flex-direction:column;gap:16px">'+profileForm(false)+'</div><button class="btn primary wide" data-a="p-save">'+ic('check',18)+t('save')+'</button></div>');break;
case 'p-glyph':ui.pf.glyph=el.dataset.v;ui.pf.photo=null;rerenderPF();break;
case 'p-color':ui.pf.color=el.dataset.v;rerenderPF();break;
case 'p-plat':ui.pf.platform=ui.pf.platform===el.dataset.v?'':el.dataset.v;rerenderPF();break;
case 'p-photo':$('#filePhoto').click();break;
case 'p-nophoto':ui.pf.photo=null;rerenderPF();break;
case 'p-lang':S.settings.lang=el.dataset.v;applyTheme();buildNav();renderOnb();break;
case 'p-save':if(!ui.pf.name.trim()){toast(t('nameReq'));return}S.profile={name:ui.pf.name.trim(),bio:ui.pf.bio.trim(),glyph:ui.pf.glyph,color:ui.pf.color,photo:ui.pf.photo,platform:ui.pf.platform};saveNow();toast(t('saved'));closeSheet();break;
case 'onb-go':if(!ui.pf.name.trim()){toast(t('nameReq'));var nf=$('#pfName');if(nf)nf.focus();return}S.profile={name:ui.pf.name.trim(),bio:ui.pf.bio.trim(),glyph:ui.pf.glyph,color:ui.pf.color,photo:ui.pf.photo,platform:ui.pf.platform};saveNow();$('#onb').hidden=true;blip(880);showApp();break;
case 'set-mode':S.settings.mode=el.dataset.v;applyTheme();save();refresh();break;
case 'set-accent':S.settings.accent=el.dataset.v;applyTheme();save();refresh();break;
case 'set-lang':S.settings.lang=el.dataset.v;applyTheme();save();buildNav();refresh();break;
case 'set-basis':S.settings.basis=el.dataset.v;save();refresh();break;
case 'set-sound':S.settings.sound=!S.settings.sound;save();if(S.settings.sound){actx()&&AC.resume();blip(700)}refresh();break;
case 'cg-del':S.settings.customGenres=S.settings.customGenres.filter(function(x){return x!==el.dataset.v});save();refresh();break;
case 'cp-del':S.settings.customPlatforms=S.settings.customPlatforms.filter(function(x){return x!==el.dataset.v});save();refresh();break;
case 'bk-shots':ui.incShots=ui.incShots===false;refresh();break;
case 'bk-show':ui.bkOpen=!ui.bkOpen;var bt=$('#bkText');if(ui.bkOpen){refresh();$('#bkText').value=makeBackup()}else refresh();break;
case 'bk-copy':var js=makeBackup();(navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(js):Promise.reject()).then(function(){toast(t('copied'))}).catch(function(){ui.bkOpen=true;refresh();var b=$('#bkText');b.value=js;b.focus();b.select();toast(t('copyFail'))});break;
case 'bk-restore':var bx=$('#bkText');if(!ui.bkOpen){ui.bkOpen=true;refresh();$('#bkText').focus();return}if(!bx.value.trim()){bx.focus();return}if(!el.dataset.armed){el.dataset.armed='1';el._h=el.innerHTML;el.textContent=t('confirmDelete');el._t=setTimeout(function(){delete el.dataset.armed;el.innerHTML=el._h},3000);return}doRestore(bx.value);break;
case 'bk-file':$('#fileRestore').click();break;
case 'copy-msg':var m=$('#cMsg').value;if(!m.trim())return;(navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(m):Promise.reject()).then(function(){toast(t('copied'))}).catch(function(){$('#cMsg').select();toast(t('copyFail'))});break;
case 'sync-all':syncAll();break;
case 'igdb-test':igdbTest();break;
case 'reset-all':twoTap(el,function(){S=defaults();saveNow();applyTheme();$('#view').innerHTML='';showOnb()});break}}
function inp(k,el){
if(k==='homeQ'){ui.q=el.value;updateHome()}
else if(k==='exQ'){ui.exQ=el.value;var q=el.value.trim();clearTimeout(liveT);
if(igdbOn()&&q.length>=3){ui.live=Object.assign(newList(),{q:q,state:'loading'});liveT=setTimeout(function(){if(ui.exQ.trim()===q)loadList('live',liveFetch,false)},450)}
updateExplore()}
else if(k==='g-title'){var g=curG();if(!g)return;g.title=el.value;if(!ui.sh.draft)save()}
else if(k==='g-dev'){var gd2=curG();if(gd2){gd2.dev=el.value;if(!ui.sh.draft)save()}}
else if(k==='g-sum'){var gs2=curG();if(gs2){gs2.summary=el.value;if(!ui.sh.draft)save()}}
else if(k.indexOf('rv-')===0){var f2=k.slice(3);if(CATS4.indexOf(f2)>=0){ui.rv[f2]=parseFloat(el.value);$('#v_'+f2).textContent=ui.rv[f2];el.style.setProperty('--fill',ui.rv[f2]*10+'%');var sc=avg(ui.rv);$('#rvScore').textContent=sc.toFixed(1);$('#rvRing').style.setProperty('--p',sc*10)}else ui.rv.text=el.value}
else if(k==='pf-name')ui.pf.name=el.value;else if(k==='pf-bio')ui.pf.bio=el.value;
else if(k.indexOf('set-')===0){S.settings[k.slice(4)]=el.value.trim();if(k.indexOf('set-igdb')===0||k==='set-proxyUrl'){ui.top=newList();ui.live=newList();directTok=null}save();if(ui.tab==='explore')updateExplore()}}
function chg(k,el){var g=curG();
if(k==='g-plat'){g.platform=el.value;save()}
else if(k==='g-year'){g.year=el.value?parseInt(el.value,10):'';save()}
else if(k==='g-num'){var v=parseFloat(el.value);v=isNaN(v)?0:Math.max(0,v);if(el.dataset.f==='played')g.played=v;else{g.hltb=g.hltb||{};g.hltb[el.dataset.f]=v}save()}}
function openLightbox(id,n,k){var g=k==='xi'?ui.xi:(S.games.find(function(x){return x.id===id})||(ui.sh&&ui.sh.draft&&ui.sh.draft.id===id?ui.sh.draft:null));if(!g)return;var arr=(k==='shots'||k==='xi')?g.shots:g.gallery;if(!arr||!arr[n])return;var lb=$('#lightbox');lb.hidden=false;lb.innerHTML='<img src="'+esc(arr[n])+'" alt="'+esc(g.title)+'"><div class="gt">'+esc(g.title)+'</div><div class="row" style="gap:10px"><button class="btn" data-a="lb-close">'+t('close')+'</button>'+((k==='shots'||k==='xi')?'':'<button class="btn danger" data-a="lb-del" data-id="'+id+'" data-n="'+n+'">'+ic('trash',18)+t('delete')+'</button>')+'</div>'}
document.addEventListener('error',function(e){var el=e.target;if(el&&el.classList&&(el.classList.contains('cimg')||el.classList.contains('rimg')))el.remove()},true);
document.addEventListener('click',function(e){var el=e.target.closest('[data-a]');if(el)act(el.dataset.a,el)});
document.addEventListener('input',function(e){var el=e.target.closest('[data-i]');if(el)inp(el.dataset.i,el)});
document.addEventListener('change',function(e){var el=e.target.closest('[data-c]');if(el)chg(el.dataset.c,el)});
document.addEventListener('submit',function(e){var f=e.target.closest('[data-f]');if(!f)return;e.preventDefault();var v=f.elements.v.value.trim();if(!v)return;if(f.dataset.f==='g-plat-add'){var pg=curG();if(!pg)return;if(allPlats().indexOf(v)<0)S.settings.customPlatforms.push(v);pg.platform=v;save();openSheet(detailSheet(pg));return}var k=f.dataset.f==='cg-add'?'customGenres':'customPlatforms';if(S.settings[k].indexOf(v)<0)S.settings[k].push(v);save();refresh()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(!$('#lightbox').hidden)$('#lightbox').hidden=true;else closeSheet()}});
$('#sheet').addEventListener('click',function(e){if(e.target.id==='sheet')closeSheet()});
$('#lightbox').addEventListener('click',function(e){if(e.target.id==='lightbox')e.target.hidden=true});
$('#view').addEventListener('animationend',function(e){if(e.target.id==='view'&&e.animationName!=='vout')e.target.className='view'});
$('#fileCover').addEventListener('change',function(e){var f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;var g=curG();if(!g)return;readImg(f,480,.82).then(function(u){g.cover=u;save();openSheet(gameSheet(g,!!ui.sh.draft));toast(t('saved'))}).catch(function(){toast(t('storageFull'))})});
$('#fileShot').addEventListener('change',function(e){var fs=Array.prototype.slice.call(e.target.files||[]),g=S.games.find(function(x){return x.id===ui.shotGame});e.target.value='';if(!g||!fs.length)return;
Promise.all(fs.map(function(f){return readImg(f,720,.68)})).then(function(urls){g.gallery=(g.gallery||[]).concat(urls);saveNow();toast(t('saved'));if(ui.sh&&ui.sh.id===g.id)openSheet(gameSheet(g,false));else refresh()}).catch(function(){toast(t('storageFull'))})});
$('#filePhoto').addEventListener('change',function(e){var f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;readImg(f,256,.8).then(function(u){ui.pf.photo=u;rerenderPF()})});
$('#fileRestore').addEventListener('change',function(e){var f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;var fr=new FileReader();fr.onload=function(){doRestore(String(fr.result))};fr.readAsText(f)});

/* ---------- boot ---------- */
function showApp(){$('#onb').hidden=true;ui.tab='home';buildNav();renderView();$('#view').className='view inr'}
function startSplash(){
 var word='Questlog';$('#wm').innerHTML=word.split('').map(function(c,i){return '<span style="--i:'+i+'">'+c+'</span>'}).join('');$('#tg').textContent=t('tagline');
 var tb=$('#tapSound');tb.innerHTML=ic('sound',16)+t('tapSound');
 var c=actx();var played=false;
 function tryPlay(full){if(played)return;if(splashSound(full)){played=true;tb.hidden=true}}
 if(c&&S.settings.sound){c.resume().then(function(){tryPlay(true)}).catch(function(){});
  setTimeout(function(){tryPlay(true);if(!played&&c.state!=='running')tb.hidden=false},250)}
 $('#splash').addEventListener('pointerdown',function(){var c2=actx();if(!c2||!S.settings.sound||played)return;c2.resume().then(function(){tryPlay(false)})},{once:true});
}
function boot(){
 applyTheme();
 startSplash();
 setTimeout(function(){var s=$('#splash');s.classList.add('hide');setTimeout(function(){s.remove()},650);if(!S.profile)showOnb();else showApp()},3400);
}
boot();
})();
</script>
</body></html>
